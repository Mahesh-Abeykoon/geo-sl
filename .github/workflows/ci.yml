name: CI

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  lint:
    name: Lint & Typecheck (Unused Code & Imports)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate mock data stubs for CI
        run: |
          mkdir -p src/data
          echo "[]" > src/data/provinces.json
          echo "[]" > src/data/districts.json
          echo "[]" > src/data/cities.json
          echo "[]" > src/data/divisions.json
          echo "[]" > src/data/banks.json
          echo "[]" > src/data/gn.json

      - name: Check types, unused locals & unused imports
        run: npm run lint

  quality:
    name: Code Quality & Dependency Policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify zero console.log in src/
        run: npm run check:console

      - name: Verify zero runtime dependencies
        run: npm run check:deps
