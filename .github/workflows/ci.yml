name: CI

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Stub environment datasets
        run: |
          mkdir -p src/data
          echo "[]" > src/data/provinces.json
          echo "[]" > src/data/districts.json
          echo "[]" > src/data/cities.json
          echo "[]" > src/data/divisions.json
          echo "[]" > src/data/banks.json
          echo "[]" > src/data/gn.json

      - name: Run strict typecheck
        run: npm run typecheck

  standards:
    name: Code Standards & Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for debugging artifacts
        run: npm run check:console

      - name: Enforce zero runtime dependencies
        run: npm run check:deps
